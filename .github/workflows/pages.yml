# Deploy the kit site to GitHub Pages via Actions instead of the legacy
# Jekyll builder. The legacy builder clones full history (~2.6 GB of video
# kit blobs) and hits its 15-minute timeout; a shallow checkout only pulls
# the current ~300 MB tree.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # a ~300 MB site takes longer than the action's default 10 min
          # to propagate; give it half an hour before declaring failure
          timeout: 1800000
